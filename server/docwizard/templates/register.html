{% extends "base.html" %}
{% block title %}Create account · DocWizard{% endblock %}
{% block content %}
<section class="narrow">
  <form method="post" action="/register" class="form">
    <label>Username <input name="username" autocomplete="username" required autofocus value="{{ username }}"></label>
    <label>Display name <input name="display_name" autocomplete="name" value="{{ display_name }}"></label>
    <label>Password <input name="password" type="password" autocomplete="new-password" required minlength="{{ min_length }}"></label>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <div class="buttons"><button type="submit" class="primary">Create account</button></div>
  </form>
</section>
{% endblock %}
