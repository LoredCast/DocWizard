{% extends "base.html" %}
{% block content %}
<p class="pad muted" role="status" id="offline-note">You're offline. Documents opened recently in this browser can still be edited; your changes are sent when the connection is back.</p>
<h2 class="pad">Recent</h2>
<table id="offline-recent" hidden>
  <thead><tr><th>Name</th><th>Project</th><th>Opened</th><th></th></tr></thead>
  <tbody></tbody>
</table>
<p class="pad muted" id="offline-empty" hidden>No documents are stored in this browser.</p>
{% endblock %}
{% block scripts %}<script type="module" src="{{ static }}/app/offline.js"></script>{% endblock %}
