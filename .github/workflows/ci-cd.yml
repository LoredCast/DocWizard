name: CI & Container Releases

on:
  push:
    branches: [main, nightly]
    tags: ["v*"]
  pull_request:
    branches: [main, nightly]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pytest pytest-asyncio hypothesis

      - name: Install pinned pandoc and Typst
        run: sudo python3 -I deploy/fetch_tools.py

      - name: Run test suite
        run: pytest

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: app
            dockerfile: deploy/Dockerfile.app
          - service: worker
            dockerfile: deploy/Dockerfile.worker
          - service: proxy
            dockerfile: deploy/Dockerfile.proxy
    steps:
      - uses: actions/checkout@v4

      - name: Compute release identifier
        id: release
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            rel="${GITHUB_REF#refs/tags/}"
            rel="${rel#v}"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            rel="sha-${GITHUB_SHA::7}"
          elif [[ "${GITHUB_REF}" == refs/heads/nightly ]]; then
            rel="nightly-${GITHUB_SHA::7}"
          else
            rel="pr-${{ github.event.pull_request.number || 'dev' }}"
          fi
          echo "release=${rel//\//-}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/docwizard-${{ matrix.service }}
          flavor: |
            latest=auto
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/nightly' }}
            type=raw,value=nightly-{{date 'YYYYMMDD'}},enable=${{ github.ref == 'refs/heads/nightly' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ github.event_name != 'pull_request' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: RELEASE=${{ steps.release.outputs.release }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
