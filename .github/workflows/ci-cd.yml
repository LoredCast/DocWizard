name: CI & Container Releases

on:
  push:
    branches: [main, nightly]
    tags: ["v*"]
  pull_request:
    branches: [main, nightly]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pytest pytest-asyncio hypothesis

      - name: Install pinned pandoc and Typst
        run: sudo python3 -I deploy/fetch_tools.py

      - name: Run test suite
        run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python (ruff, settings in pyproject.toml)
        run: |
          pip install ruff==0.16.9
          ruff check server worker tests scripts deploy

      - name: JavaScript syntax
        run: |
          find web/app tests/e2e -name '*.js' -o -name '*.mjs' | sort | xargs -n1 node --check
          node --check web/sw.js

      - name: Translations parse and templates compile
        run: |
          python -m json.tool server/docwizard/locale/de.json > /dev/null
          pip install --require-hashes -r requirements.lock
          PYTHONPATH=server python -c "
          from docwizard.http.templates import make_env
          from pathlib import Path
          env = make_env()
          for t in sorted(Path('server/docwizard/templates').glob('*.html')):
              env.get_template(t.name)
          print('templates ok')"

  e2e:
    runs-on: ubuntu-24.04  # Playwright 1.55 has no Chromium build for 26.04 yet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock

      - name: Install pinned pandoc and Typst
        run: sudo python3 -I deploy/fetch_tools.py

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser smoke tests (phone 390×844, desktop 1280×800)
        env:
          E2E_SCREENSHOTS: ${{ runner.temp }}/e2e-screenshots
          PYTHON: python
        run: node --test tests/e2e/

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e-screenshots
          if-no-files-found: ignore
          retention-days: 7

  images:
    needs: [test, lint, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: app
            dockerfile: deploy/Dockerfile.app
          - service: worker
            dockerfile: deploy/Dockerfile.worker
          - service: proxy
            dockerfile: deploy/Dockerfile.proxy
    steps:
      - uses: actions/checkout@v4

      - name: Compute release identifier
        id: release
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            rel="${GITHUB_REF#refs/tags/}"
            rel="${rel#v}"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            rel="sha-${GITHUB_SHA::7}"
          elif [[ "${GITHUB_REF}" == refs/heads/nightly ]]; then
            rel="nightly-${GITHUB_SHA::7}"
          else
            rel="pr-${{ github.event.pull_request.number || 'dev' }}"
          fi
          echo "release=${rel//\//-}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/docwizard-${{ matrix.service }}
          flavor: |
            latest=auto
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/nightly' }}
            type=raw,value=nightly-{{date 'YYYYMMDD'}},enable=${{ github.ref == 'refs/heads/nightly' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ github.event_name != 'pull_request' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: RELEASE=${{ steps.release.outputs.release }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
