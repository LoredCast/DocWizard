# Opt-in TLS termination in Caddy (ARCHITECTURE.md §18.1).
# Set DOCWIZARD_APP_HOST and DOCWIZARD_PUBLISH_HOST to bare domain names (without http://), e.g.:
#   DOCWIZARD_APP_HOST=write.example.org DOCWIZARD_PUBLISH_HOST=pub.example.org \
#     docker compose -f deploy/compose.yaml -f deploy/compose.ssl.yaml up -d --build
services:
  proxy:
    ports: !override ["80:80", "443:443"]
