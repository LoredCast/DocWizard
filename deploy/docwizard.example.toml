# DocWizard configuration. Every key can also be set as DOCWIZARD_<SECTION>_<KEY>,
# e.g. DOCWIZARD_SERVER_PUBLIC_URL. Values shown are the container defaults.

[server]
public_url = "https://write.example.org"          # the app origin
publish_url = "https://pub.example.org"           # a separate origin for previews and published sites
preview_url = "https://pub.example.org/_preview"
socket = "/run/docwizard/app.sock"                # or leave empty and set host/port
data_dir = "/var/lib/docwizard"
publish_dir = "/var/lib/docwizard-publish"
jobs_dir = "/var/lib/docwizard-jobs"
cache_dir = "/var/lib/docwizard-cache"
serve_static = false                              # the proxy serves /static/

[security]
# secret_key_file = "/run/secrets/docwizard_key"   # encrypts stored credentials; default: <data_dir>/secret.key
allow_private_outbound = []                       # e.g. ["nextcloud.lan", "10.0.0.0/8"] for servers on your LAN

[accounts]
registration = "closed"                           # open | invite | oidc-only | closed
min_password_length = 12

[sync]
default_poll_seconds = 60
max_files_per_target = 5000

# One block per login provider (§13.4). The redirect URI to register at the
# provider is <public_url>/login/oidc/<id>/callback.
# [[oidc]]
# id = "keycloak"
# label = "University login"
# issuer = "https://id.example.org/realms/main"
# client_id = "docwizard"
# client_secret_file = "/run/secrets/oidc_keycloak"
# scopes = ["openid", "profile", "email", "groups"]
# username_claim = "preferred_username"
# groups_claim = "groups"
# allowed_groups = ["students", "staff"]
# admin_groups = ["docwizard-admins"]
# auto_create = true

[render]
worker_socket = "/var/lib/docwizard-jobs/sock/worker.sock"
concurrency = 2
timeout_seconds = 90
memory_mb = 1536
default_layout = "default"

[limits]
max_document_bytes = 5000000
max_upload_bytes = 50000000

# Mail for password resets and invitations (§13.2). Without it, admins hand out
# the links from the admin area.
# [smtp]
# host = "smtp.example.org"
# port = 587
# starttls = true
# username = "docwizard@example.org"
# password_file = "/run/secrets/smtp_password"
# from = "DocWizard <docwizard@example.org>"
