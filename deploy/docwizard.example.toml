# DocWizard configuration. Every key can also be set as DOCWIZARD_<SECTION>_<KEY>,
# e.g. DOCWIZARD_SERVER_PUBLIC_URL. Values shown are the container defaults.

[server]
public_url = "https://write.example.org"          # the app origin
publish_url = "https://pub.example.org"           # a separate origin for previews and published sites
preview_url = "https://pub.example.org/_preview"
socket = "/run/docwizard/app.sock"                # or leave empty and set host/port
data_dir = "/var/lib/docwizard"
publish_dir = "/var/lib/docwizard-publish"
jobs_dir = "/var/lib/docwizard-jobs"
cache_dir = "/var/lib/docwizard-cache"
serve_static = false                              # the proxy serves /static/
# index_public_sites = false                      # keep public publications out of search engines; also set
#                                                 # DOCWIZARD_PUBLIC_ROBOTS="noindex, nofollow" for the proxy

[security]
# secret_key_file = "/run/secrets/docwizard_key"   # encrypts stored credentials; default: <data_dir>/secret.key
allow_private_outbound = []                       # e.g. ["nextcloud.lan", "10.0.0.0/8"] for servers on your LAN
# An anti-bot challenge on registration and password reset, for open registration:
# captcha_provider = "turnstile"                  # or "hcaptcha"
# captcha_site_key = "..."
# captcha_secret_file = "/run/secrets/captcha"

[accounts]
registration = "closed"                           # open | invite | oidc-only | closed
min_password_length = 12
# require_email_verification = true              # confirm an email address before publishing or syncing; needs [smtp]

[sync]
default_poll_seconds = 60
max_files_per_target = 5000
# folder_roots = ["/srv/docwizard-folders"]       # folders on this server that projects may sync with
# git = true                                      # git repositories over HTTPS; needs git on the PATH

# One block per login provider (§13.4). The redirect URI to register at the
# provider is <public_url>/login/oidc/<id>/callback.
# [[oidc]]
# id = "keycloak"
# label = "University login"
# issuer = "https://id.example.org/realms/main"
# client_id = "docwizard"
# client_secret_file = "/run/secrets/oidc_keycloak"
# scopes = ["openid", "profile", "email", "groups"]
# username_claim = "preferred_username"
# groups_claim = "groups"
# allowed_groups = ["students", "staff"]
# admin_groups = ["docwizard-admins"]
# auto_create = true

[render]
worker_socket = "/var/lib/docwizard-jobs/sock/worker.sock"
concurrency = 2                                   # give the worker the same: DOCWIZARD_WORKER_CONCURRENCY
timeout_seconds = 90                              # admins can set another per account
memory_mb = 1536
default_layout = "default"
fast_lane = 1                                     # slots LaTeX can't take, so HTML and Typst previews never wait
# More render workers, on this machine or on others sharing the folders (§9.2): each folder holds
# that worker's socket (worker.sock) and its job folders (run/). Jobs go to the least busy one.
# extra_workers = ["/var/lib/docwizard-jobs-2", "/mnt/render-b/jobs"]
user_previews = 1                                 # previews per person at a time
user_exports = 2                                  # exports per person queued or running; more get 429
# For public hosting, also budget what one person can render (0: no limit):
# per_user_rpm = 20                               # renders per minute (cache hits are free)
# latex_daily_limit = 50                          # LaTeX builds per day
# allow_latex = false                             # LaTeX only for accounts an admin allows

# Links in every page's footer, for public hosting (terms, privacy policy, imprint, abuse contact):
# [legal]
# terms_url = "https://example.org/terms"
# privacy_url = "https://example.org/privacy"
# imprint_url = "https://example.org/imprint"
# abuse_email = "abuse@example.org"

[limits]
max_document_bytes = 5000000
max_upload_bytes = 50000000
default_quota_bytes = 2000000000                  # per account, trash included; 0: no limit
# For public hosting, also bound how many objects one account can make (0: no limit):
# max_projects_per_user = 50
# max_files_per_project = 1000

# Grammar checking (§6.8). Harper is built in and runs in each browser, for English. A LanguageTool
# server checks other languages too; the app passes the text on to it. With the public
# api.languagetoolplus.com, texts leave your server: run your own (e.g. the erikvl87/languagetool image).
# [grammar]
# harper = true
# languagetool_url = "http://languagetool:8010"
# languagetool_api_key = ""          # only for LanguageTool Premium
# languagetool_username = ""

# Mail for password resets and invitations (§13.2). Without it, admins hand out
# the links from the admin area.
# [smtp]
# host = "smtp.example.org"
# port = 587
# starttls = true
# username = "docwizard@example.org"
# password_file = "/run/secrets/smtp_password"
# from = "DocWizard <docwizard@example.org>"
