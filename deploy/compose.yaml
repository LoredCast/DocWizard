# docker compose -f deploy/compose.yaml up -d   (ARCHITECTURE.md §18.1)
# Before the first start: copy deploy/docwizard.example.toml to deploy/docwizard.toml and edit the URLs.
# Pulls rolling main images from GHCR by default (set DOCWIZARD_TAG for a pinned release, or pass --build).
# Listens on 127.0.0.1:8080 (app) and 127.0.0.1:8081 (publish/preview) over HTTP by default, for an
# external reverse proxy that handles TLS and domains. Add -f deploy/compose.ssl.yaml to expose 80/443
# with Caddy managing TLS directly.
services:
  app:
    image: ${DOCWIZARD_REGISTRY:-ghcr.io/loredcast}/docwizard-app:${DOCWIZARD_TAG:-main}
    build: { context: .., dockerfile: deploy/Dockerfile.app }
    restart: unless-stopped
    user: "10001:10001"
    volumes:
      - data:/var/lib/docwizard
      - publish:/var/lib/docwizard-publish
      - jobs:/var/lib/docwizard-jobs
      - render-cache:/var/lib/docwizard-cache
      - run:/run/docwizard
      - ./docwizard.toml:/etc/docwizard/docwizard.toml:ro
    depends_on: [worker]

  worker:
    image: ${DOCWIZARD_REGISTRY:-ghcr.io/loredcast}/docwizard-worker:${DOCWIZARD_TAG:-main}
    build: { context: .., dockerfile: deploy/Dockerfile.worker }
    restart: unless-stopped
    user: "0:0" # supervisor only; every job runs as its own user
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, SETUID, SETGID, KILL] # no DAC_OVERRIDE: can't read job files
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 4g
    tmpfs: ["/tmp"]
    volumes:
      - jobs:/var/lib/docwizard-jobs
      - render-cache:/var/lib/docwizard-cache:ro

  proxy:
    image: ${DOCWIZARD_REGISTRY:-ghcr.io/loredcast}/docwizard-proxy:${DOCWIZARD_TAG:-main}
    build: { context: .., dockerfile: deploy/Dockerfile.proxy }
    restart: unless-stopped
    ports:
      - "${DOCWIZARD_APP_LISTEN:-127.0.0.1:8080}:8080"
      - "${DOCWIZARD_PUBLISH_LISTEN:-127.0.0.1:8081}:8081"
    environment:
      DOCWIZARD_TRUSTED_PROXIES: ${DOCWIZARD_TRUSTED_PROXIES:-private_ranges}
    volumes:
      - run:/run/docwizard
      - publish:/srv/publish:ro
      - caddy:/data

volumes: { data: {}, publish: {}, jobs: {}, render-cache: {}, run: {}, caddy: {} }
